<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: #002211; color: #b0e8d0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }

#game {
  width: 100vw; height: 100vh;
  display: flex; flex-direction: column;
  position: relative; overflow: hidden;
}

/* ─── Header ─── */
#header {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 8px 16px; flex-shrink: 0;
  background: rgba(0,204,136,0.06);
  border-bottom: 1px solid rgba(0,204,136,0.15);
  z-index: 10;
}
#header h1 { font-size: 1rem; }
.hdr-item { font-size: 0.75rem; opacity: 0.7; }
.hdr-item b { color: #00cc88; opacity: 1; }
.hdr-item .val { color: #00cc88; font-weight: bold; font-size: 0.9rem; }

/* ─── Scene ─── */
#scene {
  flex: 1; position: relative; overflow: hidden;
  background: linear-gradient(180deg, #0a0a2e 0%, #001a0a 100%);
  min-height: 0;
}
#scene-bg { position: absolute; inset: 0; transition: background 0.8s; pointer-events: none; }
.star { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; opacity: 0.4; pointer-events: none; }
#ground {
  position: absolute; bottom: 0; left: 0; right: 0; height: 40px;
  background: linear-gradient(180deg, #1a4a2a, #0d2a15);
  border-top: 2px solid rgba(0,204,136,0.2); pointer-events: none;
}
#ground-inner { position: absolute; top: 2px; left: 0; right: 0; height: 4px; background: rgba(0,204,136,0.06); }

#engine-core {
  position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
  width: 48px; height: 48px; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,204,136,0.25), rgba(0,204,136,0.05));
  border: 2px solid rgba(0,204,136,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem; pointer-events: none; z-index: 2;
  animation: enginePulse 2s ease-in-out infinite;
  transition: 0.3s;
}
@keyframes enginePulse { 0%,100%{box-shadow:0 0 10px rgba(0,204,136,0.1)} 50%{box-shadow:0 0 25px rgba(0,204,136,0.25)} }
#engine-label {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  font-size: 0.5rem; opacity: 0.25; text-transform: uppercase; letter-spacing: 1px;
  pointer-events: none; white-space: nowrap;
}

/* ─── Scene Elements ─── */
.scene-el {
  position: absolute; pointer-events: none; transition: opacity 0.4s;
}
#player-el { font-size: 2rem; z-index: 3; }
#player-el .equip-slot { position: absolute; font-size: 0.85rem; pointer-events: none; transition: none; }
#player-el.jump { animation: playerJump 0.4s ease-out; }
#player-el.djump { animation: playerDJump 0.6s ease-out; }
#player-el.dash { animation: playerDash 0.3s ease-out; }
@keyframes playerJump { 0%{transform:translateY(0)} 40%{transform:translateY(-30px)} 100%{transform:translateY(0)} }
@keyframes playerDJump { 0%{transform:translateY(0)} 25%{transform:translateY(-20px)} 50%{transform:translateY(-40px)} 75%{transform:translateY(-20px)} 100%{transform:translateY(0)} }
@keyframes playerDash { 0%{transform:translateX(0)} 100%{transform:translateX(60px)} }
.enemy-el { font-size: 1.4rem; z-index: 2; }
.powerup-el { font-size: 1.2rem; z-index: 2; animation: floatItem 1.5s ease-in-out infinite; }
@keyframes floatItem { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
.coin-el { font-size: 1rem; z-index: 1; }
.cloud-el { font-size: 1.2rem; z-index: 0; opacity: 0.3; animation: cloudDrift 20s linear infinite; }
@keyframes cloudDrift { 0%{transform:translateX(0)} 100%{transform:translateX(200px)} }
.tree-el { font-size: 1.6rem; z-index: 1; }
.weapon-el { font-size: 0.9rem; position: absolute; z-index: 3; }
.boss-el { font-size: 2.5rem; z-index: 2; animation: bossPulse 1s ease-in-out infinite; }
@keyframes bossPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
.particle-el {
  position: absolute; width: 3px; height: 3px; border-radius: 50%;
  pointer-events: none; z-index: 1; opacity: 0.5;
}
.music-el { font-size: 1rem; z-index: 1; opacity: 0.3; animation: musicFloat 3s ease-in-out infinite; }
@keyframes musicFloat { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-10px) rotate(10deg)} }
.platform-el {
  position: absolute; height: 10px; border-radius: 3px; z-index: 1; pointer-events: none;
  background: linear-gradient(180deg, #3a6a3a, #2a4a2a);
  border: 1px solid rgba(0,204,136,0.15);
}
#scene-score {
  position: absolute; top: 10px; left: 12px; font-size: 0.7rem; opacity: 0; z-index: 5;
  transition: opacity 0.4s; color: #00cc88; pointer-events: none;
}
#scene-health {
  position: absolute; top: 10px; right: 12px; width: 100px; height: 10px; z-index: 5;
  opacity: 0; transition: opacity 0.4s;
  background: rgba(255,0,0,0.15); border-radius: 5px; overflow: hidden;
  pointer-events: none;
}
#scene-health-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #ff4444, #ff6644); border-radius: 5px; transition: width 0.3s; }
#scene-level {
  position: absolute; top: 28px; left: 12px; font-size: 0.6rem; opacity: 0; z-index: 5;
  transition: opacity 0.4s; color: rgba(0,204,136,0.4); pointer-events: none;
}
.water-el {
  position: absolute; bottom: 40px; left: 0; right: 0; height: 20px; z-index: 1; pointer-events: none;
  background: linear-gradient(180deg, rgba(0,100,150,0.3), rgba(0,60,100,0.2));
  animation: waterWave 3s ease-in-out infinite;
}
@keyframes waterWave { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }

/* ─── Bugs ─── */
.bug {
  position: absolute; font-size: 1.5rem; cursor: pointer; z-index: 10;
  transition: transform 0.05s; pointer-events: auto;
  animation: bugSpawn 0.3s ease-out;
}
@keyframes bugSpawn { 0%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }
.bug.squashed {
  pointer-events: none; animation: bugSquash 0.25s ease-out forwards;
}
@keyframes bugSquash { 0%{transform:scale(1);opacity:1} 50%{transform:scale(1.8);opacity:0.5} 100%{transform:scale(0);opacity:0} }
.bug-hit {
  position: absolute; font-size: 1.2rem; pointer-events: none; z-index: 11;
  animation: hitFloat 0.6s ease-out forwards;
}
@keyframes hitFloat { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-30px) scale(0.5)} }
.bug.armored { box-shadow: 0 0 0 2px rgba(255,200,50,0.4), 0 0 8px rgba(255,200,50,0.15); }
.bug.fast { filter: drop-shadow(0 0 4px rgba(0,200,255,0.3)); }
.bug.stealth { opacity: 0.45; }
.bug.hit-armor { animation: armorFlash 0.15s ease-out; }
@keyframes armorFlash { 0%{transform:scale(1.2);filter:brightness(2)} 100%{transform:scale(1);filter:none} }

/* ─── Shield ─── */
.shield-el {
  position: absolute; bottom: 38px; left: 50%; transform: translateX(-50%);
  width: 100px; height: 100px; border-radius: 50%;
  border: 2px solid rgba(0,204,255,0.3);
  background: radial-gradient(circle, rgba(0,204,255,0.08), transparent);
  pointer-events: none; z-index: 5;
  animation: shieldPulse 2s ease-in-out infinite;
}
@keyframes shieldPulse { 0%,100%{transform:translateX(-50%) scale(1);opacity:0.6} 50%{transform:translateX(-50%) scale(1.08);opacity:1} }

/* ─── Achievements Panel ─── */
#achieve-overlay {
  position: absolute; inset: 0; z-index: 70;
  background: rgba(0,0,0,0.8); display: none;
  align-items: center; justify-content: center;
}
#achieve-overlay.show { display: flex; }
#achieve-panel {
  width: min(380px, 85vw); max-height: 70vh; overflow-y: auto;
  background: #001a0a; border: 1px solid rgba(0,204,136,0.2);
  border-radius: 16px; padding: 20px;
}
#achieve-panel::-webkit-scrollbar { width: 4px; }
#achieve-panel::-webkit-scrollbar-track { background: transparent; }
#achieve-panel::-webkit-scrollbar-thumb { background: rgba(0,204,136,0.2); border-radius: 2px; }
#achieve-panel h2 { font-size: 1.1rem; color: #00cc88; margin-bottom: 12px; }
.ach-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px; margin-bottom: 4px;
  background: rgba(0,204,136,0.04); opacity: 0.35;
}
.ach-item.unlocked { opacity: 1; background: rgba(0,204,136,0.08); }
.ach-item .icon { font-size: 1.3rem; }
.ach-item .info { flex: 1; }
.ach-item .title { font-size: 0.8rem; color: #b0e8d0; }
.ach-item .desc { font-size: 0.6rem; opacity: 0.5; }
.ach-item .date { font-size: 0.5rem; opacity: 0.25; margin-left: auto; white-space: nowrap; }
#achieve-close {
  display: block; margin: 12px auto 0;
  background: rgba(0,204,136,0.12); border: 1px solid rgba(0,204,136,0.25);
  color: #00cc88; padding: 6px 24px; border-radius: 10px; cursor: pointer; font-size: 0.8rem;
}
#achieve-close:hover { background: rgba(0,204,136,0.22); }

/* ─── Achievement Toast ─── */
#achieve-toast {
  position: absolute; top: 30%; left: 50%; transform: translate(-50%,-50%);
  z-index: 75; pointer-events: none;
  background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.25);
  border-radius: 14px; padding: 12px 24px; text-align: center;
  opacity: 0; transition: none;
}
#achieve-toast.show {
  animation: achievePop 1.8s ease-out forwards;
}
@keyframes achievePop {
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.3)}
  15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  25%{transform:translate(-50%,-50%) scale(1)}
  70%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-60%) scale(0.9)}
}
#achieve-toast .icon { font-size: 2rem; display: block; margin-bottom: 4px; }
#achieve-toast .title { font-size: 0.9rem; font-weight: bold; color: #ffd700; letter-spacing: 0.5px; }
#achieve-toast .desc { font-size: 0.65rem; opacity: 0.6; }

/* ─── Boss Bug ─── */
.bug.boss {
  font-size: 2.5rem; z-index: 12;
  filter: drop-shadow(0 0 8px rgba(255,50,50,0.4));
  animation: bossBugSpawn 0.4s ease-out, bossBugPulse 0.8s ease-in-out infinite 0.4s;
}
@keyframes bossBugSpawn { 0%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }
@keyframes bossBugPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
.bug.boss .hp-bar {
  position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
  width: 30px; height: 4px; background: rgba(255,0,0,0.2); border-radius: 2px; overflow: hidden;
}
.bug.boss .hp-fill { height: 100%; background: #ff4444; border-radius: 2px; transition: width 0.15s; }

/* ─── Combo Meter ─── */
#combo-meter {
  position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
  z-index: 5; pointer-events: none; text-align: center; opacity: 0;
  transition: opacity 0.2s;
}
#combo-meter.show { opacity: 1; }
#combo-meter .count { font-size: 1.4rem; font-weight: bold; color: #ffd700; }
#combo-meter .label { font-size: 0.55rem; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; }
#combo-meter .timer-bar {
  width: 60px; height: 3px; background: rgba(255,215,0,0.15); border-radius: 2px; margin: 3px auto 0; overflow: hidden;
}
#combo-meter .timer-fill { height: 100%; background: #ffd700; border-radius: 2px; transition: width 0.1s; }

/* ─── Floating Score ─── */
.float-score {
  position: absolute; font-size: 0.9rem; font-weight: bold; pointer-events: none; z-index: 15;
  animation: floatUp 0.7s ease-out forwards;
}
@keyframes floatUp { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-40px) scale(0.6)} }

/* ─── Stats Panel ─── */
#stats-overlay {
  position: absolute; inset: 0; z-index: 70;
  background: rgba(0,0,0,0.8); display: none;
  align-items: center; justify-content: center;
}
#stats-overlay.show { display: flex; }
#stats-panel {
  width: min(360px, 85vw); max-height: 70vh; overflow-y: auto;
  background: #001a0a; border: 1px solid rgba(0,204,136,0.2);
  border-radius: 16px; padding: 20px;
}
#stats-panel h2 { font-size: 1.1rem; color: #00cc88; margin-bottom: 12px; }
.stat-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 0.75rem; border-bottom: 1px solid rgba(0,204,136,0.05); }
.stat-row:last-child { border: none; }
.stat-row .label { opacity: 0.5; }
.stat-row .value { color: #00cc88; font-weight: bold; }
#stats-close {
  display: block; margin: 12px auto 0;
  background: rgba(0,204,136,0.12); border: 1px solid rgba(0,204,136,0.25);
  color: #00cc88; padding: 6px 24px; border-radius: 10px; cursor: pointer; font-size: 0.8rem;
}
#stats-close:hover { background: rgba(0,204,136,0.22); }

/* ─── List Panel ─── */
#list-overlay, #settings-overlay {
  position: absolute; inset: 0; z-index: 40;
  background: rgba(0,0,0,0.7); display: flex;
  align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: 0.2s;
}
#list-overlay.show, #settings-overlay.show { opacity: 1; pointer-events: auto; }
#list-panel, #settings-panel {
  background: #001a0e; border: 1px solid rgba(0,204,136,0.2);
  border-radius: 16px; padding: 20px; max-width: 420px; width: 90%;
  max-height: 80vh; overflow-y: auto; position: relative;
}
#list-panel h2, #settings-panel h2 { font-size: 1rem; margin-bottom: 12px; text-align: center; color: #00cc88; }
#list-panel .feat-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px; border-radius: 6px; font-size: 0.75rem;
  border-bottom: 1px solid rgba(0,204,136,0.06);
}
#list-panel .feat-row .icon { font-size: 1rem; width: 24px; text-align: center; }
#list-panel .feat-row .name { flex: 1; font-weight: bold; }
#list-panel .feat-row .desc { flex: 2; opacity: 0.6; font-size: 0.65rem; }
#list-panel .feat-row.locked { opacity: 0.4; }
#list-panel .feat-row.unlocked { opacity: 1; }
#list-panel .feat-row.unlocked .name { color: #ffd700; }
#list-close, #settings-close {
  display: block; margin: 12px auto 0;
  background: rgba(0,204,136,0.12); border: 1px solid rgba(0,204,136,0.25);
  color: #00cc88; padding: 6px 24px; border-radius: 10px; cursor: pointer; font-size: 0.8rem;
}
#list-close:hover, #settings-close:hover { background: rgba(0,204,136,0.22); }
#settings-panel .set-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; border-bottom: 1px solid rgba(0,204,136,0.06);
  font-size: 0.8rem;
}
#settings-panel .set-row:last-child { border: none; }

/* ─── Audio Panel ─── */
#audio-overlay {
  position: absolute; inset: 0; z-index: 40;
  background: rgba(0,0,0,0.7); display: flex;
  align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: 0.2s;
}
#audio-overlay.show { opacity: 1; pointer-events: auto; }
#audio-panel {
  background: #001a0e; border: 1px solid rgba(0,204,136,0.2);
  border-radius: 16px; padding: 20px; max-width: 360px; width: 90%;
}
#audio-panel h2 { font-size: 1rem; margin-bottom: 16px; text-align: center; color: #00cc88; }
#audio-panel .vol-row { margin-bottom: 14px; }
#audio-panel .vol-row label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px; }
#audio-panel .vol-row input[type=range] { width: 100%; height: 4px; -webkit-appearance: none; background: rgba(0,204,136,0.15); border-radius: 2px; outline: none; }
#audio-panel .vol-row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #00cc88; cursor: pointer; border: none; }
#audio-close {
  display: block; margin: 16px auto 0;
  background: rgba(0,204,136,0.12); border: 1px solid rgba(0,204,136,0.25);
  color: #00cc88; padding: 6px 24px; border-radius: 10px; cursor: pointer; font-size: 0.8rem;
}
#audio-close:hover { background: rgba(0,204,136,0.22); }

/* ─── Header Buttons ─── */
.hdr-btn {
  background: none; border: 1px solid rgba(0,204,136,0.15);
  color: #00cc88; padding: 3px 8px; border-radius: 6px;
  cursor: pointer; font-size: 0.8rem; transition: 0.15s;
}
.hdr-btn:hover { border-color: #00cc88; background: rgba(0,204,136,0.1); }
#reset-btn { color: rgba(255,100,100,0.5); border-color: rgba(255,100,100,0.15); }
#reset-btn:hover { color: #ff6666; border-color: #ff6666; }
#mute-btn { font-size: 0.75rem; padding: 3px 6px; }
#mute-btn.muted { color: rgba(255,100,100,0.5); border-color: rgba(255,100,100,0.15); }
#mute-btn.muted:hover { color: #ff6666; }

/* ─── Power-ups ─── */
.powerup {
  position: absolute; font-size: 1.6rem; z-index: 9; cursor: pointer; pointer-events: auto;
  animation: powerupSpawn 0.3s ease-out, powerupFloat 1.2s ease-in-out infinite 0.3s;
}
@keyframes powerupSpawn { 0%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }
@keyframes powerupFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.powerup .glow {
  position: absolute; inset: -8px; border-radius: 50%; pointer-events: none;
  animation: powerupGlow 1s ease-in-out infinite;
}
@keyframes powerupGlow { 0%,100%{opacity:0.3} 50%{opacity:0.6} }
.powerup[data-type="freeze"] .glow { background: radial-gradient(circle, rgba(100,200,255,0.2), transparent); }
.powerup[data-type="bomb"] .glow { background: radial-gradient(circle, rgba(255,150,50,0.2), transparent); }
.powerup[data-type="double"] .glow { background: radial-gradient(circle, rgba(255,215,0,0.2), transparent); }

/* ─── Active Effects Bar ─── */
#active-effects {
  position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
  z-index: 8; display: flex; gap: 6px; pointer-events: none;
}
.active-eff {
  font-size: 0.6rem; padding: 2px 8px; border-radius: 6px;
  background: rgba(0,0,0,0.4); border: 1px solid rgba(0,204,136,0.15);
  opacity: 0; transition: opacity 0.2s; display: flex; align-items: center; gap: 4px;
}
.active-eff.show { opacity: 0.8; }
.active-eff .timer { color: #ffd700; font-weight: bold; }

/* ─── Squash Particles ─── */
.squash-particle {
  position: absolute; width: 4px; height: 4px; border-radius: 50%;
  pointer-events: none; z-index: 13;
  animation: particleBurst 0.5s ease-out forwards;
}
@keyframes particleBurst { 0%{opacity:1;transform:translate(0,0) scale(1)} 100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)} }

/* ─── Bug Trails ─── */
.bug-trail {
  position: absolute; width: 3px; height: 3px; border-radius: 50%;
  pointer-events: none; z-index: 1;
  animation: trailFade 0.6s ease-out forwards;
}
@keyframes trailFade { 0%{opacity:0.5;transform:scale(1)} 100%{opacity:0;transform:scale(0)} }

/* ─── Screen Shake ─── */
#game.shake {
  animation: screenShake 0.15s ease-out;
}
@keyframes screenShake {
  0%{transform:translate(0,0)} 20%{transform:translate(-3px,2px)} 40%{transform:translate(2px,-1px)} 60%{transform:translate(-1px,3px)} 80%{transform:translate(1px,-2px)} 100%{transform:translate(0,0)}
}

/* ─── Mult Display ─── */
#mult-display {
  font-size: 0.7rem; padding: 2px 8px; border-radius: 6px;
  background: rgba(255,215,0,0.08); border: 1px solid rgba(255,215,0,0.12);
  opacity: 0.6; white-space: nowrap;
}
#mult-display .mult-val { color: #ffd700; font-weight: bold; }

/* ─── Projectiles ─── */
.projectile {
  position: absolute; z-index: 14; pointer-events: none; font-size: 1.2rem;
}
.projectile.fired {
  animation: none;
}
@keyframes projTrail { 0%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(0.3)} }
.proj-trail {
  position: absolute; width: 4px; height: 4px; border-radius: 50%;
  background: #ffd700; pointer-events: none; z-index: 13;
  animation: projTrail 0.3s ease-out forwards;
}

/* ─── Crosshair ─── */
#game.gun-ready #scene { cursor: crosshair; }


/* ─── Chat Log ─── */
#chat-log {
  flex-shrink: 0; max-height: 120px; overflow-y: auto;
  padding: 6px 16px; background: rgba(0,0,0,0.3);
  border-top: 1px solid rgba(0,204,136,0.08);
  border-bottom: 1px solid rgba(0,204,136,0.08);
  z-index: 10;
}
#chat-log::-webkit-scrollbar { width: 4px; }
#chat-log::-webkit-scrollbar-track { background: transparent; }
#chat-log::-webkit-scrollbar-thumb { background: rgba(0,204,136,0.2); border-radius: 2px; }
.chat-msg { font-size: 0.7rem; padding: 2px 0; opacity: 0.8; }
.chat-msg.prompt { color: #80d8b0; }
.chat-msg.ai { color: #00cc88; }
.chat-msg.ai .emoji { margin-right: 4px; }
.chat-msg.warn { color: #ff8844; }
.chat-msg.err { color: #ff4444; }

/* ─── Input ─── */
#input-row {
  display: flex; gap: 8px; padding: 8px 16px; flex-shrink: 0;
  background: rgba(0,0,0,0.4);
  z-index: 10;
}
#prompt-input {
  flex: 1; background: rgba(0,204,136,0.06);
  border: 1px solid rgba(0,204,136,0.2); border-radius: 10px;
  color: #b0e8d0; padding: 8px 14px; font-size: 0.85rem; outline: none;
  font-family: inherit; transition: 0.15s;
}
#prompt-input:focus { border-color: #00cc88; background: rgba(0,204,136,0.1); }
#prompt-input::placeholder { color: rgba(0,204,136,0.25); }
#prompt-input:disabled { opacity: 0.4; }
#send-btn {
  background: rgba(0,204,136,0.12); border: 1px solid rgba(0,204,136,0.25);
  color: #00cc88; padding: 8px 18px; border-radius: 10px;
  font-size: 0.85rem; cursor: pointer; white-space: nowrap; transition: 0.15s;
  font-family: inherit; font-weight: bold;
}
#send-btn:hover { background: rgba(0,204,136,0.22); border-color: #00cc88; }
#send-btn:disabled { opacity: 0.3; cursor: default; }

/* ─── Glitch Overlay ─── */
#glitch {
  position: absolute; inset: 0; pointer-events: none; z-index: 50;
  opacity: 0; transition: opacity 0.1s;
  background: repeating-linear-gradient(0deg, rgba(255,0,0,0.1) 0px, rgba(0,255,0,0.05) 2px, transparent 4px);
}
#glitch.active { opacity: 1; animation: glitchShake 0.2s ease-out; }
@keyframes glitchShake {
  0%{transform:translate(0,0)} 20%{transform:translate(-4px,2px)} 40%{transform:translate(4px,-1px)} 60%{transform:translate(-2px,3px)} 80%{transform:translate(2px,-2px)} 100%{transform:translate(0,0)}
}
#glitch-overlay {
  position: absolute; inset: 0; pointer-events: none; z-index: 45;
  background: rgba(255,0,0,0.08); opacity: 0; transition: opacity 0.15s;
}
#glitch-overlay.active { animation: flashGlitch 0.3s ease-out; }
@keyframes flashGlitch { 0%{opacity:1} 100%{opacity:0} }

/* ─── Toast ─── */
#toast {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  z-index: 60; pointer-events: none;
  font-size: 1.2rem; font-weight: bold; color: #00cc88;
  opacity: 0; transition: none;
}
#toast.show {
  animation: toastAnim 1s ease-out forwards;
}
@keyframes toastAnim { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.5)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)} 30%{transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0;transform:translate(-50%,-60%) scale(1)} }

/* ─── Features Bar ─── */
#features-bar {
  flex-shrink: 0; padding: 3px 16px 5px;
  background: rgba(0,0,0,0.2); z-index: 10;
  font-size: 0.65rem;
}
#features-bar span { opacity: 0.4; }
#features-bar .feat { opacity: 0.7; color: #00cc88; margin-right: 8px; }

/* ─── Thinking Indicator ─── */
#thinking {
  position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
  font-size: 0.75rem; color: #00cc88; opacity: 0; z-index: 5;
  transition: opacity 0.2s; pointer-events: none;
  background: rgba(0,0,0,0.4); padding: 4px 16px; border-radius: 10px;
}
#thinking.show { opacity: 0.7; }

/* ─── Responsive ─── */
@media (max-width: 600px) {
  #header { gap: 4px; padding: 4px 6px; }
  #header h1 { font-size: 0.75rem; }
  .hdr-item { font-size: 0.6rem; }
  .hdr-btn { font-size: 0.65rem; padding: 2px 5px; }
  #achieve-btn { font-size: 0.7rem !important; padding: 2px 6px !important; }
  #chat-log { max-height: 60px; }
  #input-row { padding: 4px 6px; gap: 4px; }
  #prompt-input { font-size: 0.75rem; padding: 5px 8px; }
  #send-btn { padding: 5px 10px; font-size: 0.75rem; }
  #features-bar { font-size: 0.55rem; padding: 2px 8px 4px; }
}
@media (max-width: 400px) {
  #header .hdr-item:nth-child(n+4) { display: none; }
}
</style>

<script>
/* ═══════════════════════════════════════════════════════════════════
   Prompter — Prompt an AI to build a game, squash the bugs!
   ═══════════════════════════════════════════════════════════════════ */

/* ─── State ─── */
const LS_KEY = 'prompter_save';
const state = {
  score: 0, squashed: 0, missed: 0, streak: 0, bestStreak: 0,
  features: new Set(),
  allFeatures: [],
  scene: {
    player: false, jump: false, djump: false, dash: false,

    // UI unlocks
    ui_achievements: false, ui_stats: false, ui_mute: false, ui_reset: false,
    ui_combo: false, ui_streak: false, ui_mood: false, ui_list: false, ui_settings: false, ui_audio: false
  },
  bugs: [], busy: false, bugWaves: 0, bugSpeed: 0.3,
  promptCount: 0, cleanWaves: 0, totalWaves: 0,
  achievements: {},
  combo: { count: 0, multiplier: 1, timer: 0, maxCombo: 0 },
  totalSquashed: 0, bossKills: 0, bossWaves: 0, powerupsCollected: 0,
  muted: false,
  volumeMaster: 1, volumeMusic: 1, volumeSfx: 1,
  effects: {}, // { freeze, bomb, double } - active effect timestamps
  powerupTimer: 0,
  powerupEl: null,
  playerPos: { x: 0, y: 0 }, playerSpeed: 3,
  ammo: 0, maxAmmo: 12,
  projectiles: [],
  keys: {},
  mouseX: 0, mouseY: 0,
  shootCooldown: 0,
  gameOver: false
};

const BUG_EMOJIS = ['🐛','🪲','🦗','🐜','🦟','🐝','🪰','🪱'];
const RESPONSES = [
  'Processing your request... done!', 'Great idea! Adding it now.',
  'Love it! Compiling...', 'Oh, that\'s a good one! Implemented.',
  'On it! Feature added.', 'Let me work on that... done!',
  'Excellent choice! Built it in.', 'You read my mind! Added.',
  'Whoa, nice! Feature integrated.', 'Coding that up... complete!'
];
const WARN_RESPONSES = [
  'Bug detected! Squash it!', 'Something got through... catch it!',
  'A bug slipped in! Quick!', 'Incoming bug!'
];
const GLITCH_RESPONSES = [
  'Bug reached the engine! ⚠️', 'Corruption detected!',
  'Engine compromised!', 'Bug in the code! 🔴'
];

/* ─── Achievements ─── */
const ACHIEVEMENTS = {
  first_squash:  { icon:'🐛', title:'First Squash',      desc:'Squash your first bug',            check:s=>s.squashed>=1 },
  squasher_10:   { icon:'🪲', title:'Bug Squasher',       desc:'Squash 10 bugs',                   check:s=>s.squashed>=10 },
  exterminator:  { icon:'🦗', title:'Bug Exterminator',   desc:'Squash 50 bugs',                   check:s=>s.squashed>=50 },
  annihilator:   { icon:'💥', title:'Bug Annihilator',    desc:'Squash 100 bugs',                  check:s=>s.squashed>=100 },
  feature_5:     { icon:'⭐', title:'Feature Creep',      desc:'Add 5 features',                   check:s=>s.features.size>=5 },
  designer:      { icon:'🎮', title:'Game Designer',      desc:'Add 10 features',                  check:s=>s.features.size>=10 },
  full_build:    { icon:'🏗️', title:'Full Build',        desc:'Add all 20 features',              check:s=>s.features.size>=20 },
  streak_5:      { icon:'🔥', title:'On Fire',            desc:'Reach 5 streak',                   check:s=>s.streak>=5 },
  unstoppable:   { icon:'🔥🔥',title:'Unstoppable',        desc:'Reach 10 streak',                  check:s=>s.streak>=10 },
  clean_code_5:  { icon:'✨', title:'Clean Code',         desc:'Complete 5 waves bug-free',        check:s=>s.cleanWaves>=5 },
  clean_code_10: { icon:'🌟', title:'Spotless',           desc:'Complete 10 waves bug-free',       check:s=>s.cleanWaves>=10 },
  high_score:    { icon:'🏆', title:'High Scorer',        desc:'Reach 500 points',                 check:s=>s.score>=500 },
  glitch_survivor:{icon:'😵', title:'Glitch Survivor',    desc:'Survive 10 engine breaches',        check:s=>s.missed>=10 },
  veteran:       { icon:'🎯', title:'Prompt Veteran',     desc:'Send 50 prompts',                  check:s=>s.promptCount>=50 },
  collector:     { icon:'📚', title:'Feature Collector',  desc:'Unlock every achievement',          check:s=>Object.keys(ACHIEVEMENTS).every(k=>s.achievements[k]) },
  boss_killer:   { icon:'👑', title:'Bug Boss Slayer',    desc:'Defeat 3 boss bugs',                check:s=>(s.bossKills||0)>=3 },
  combo_10:      { icon:'💫', title:'Combo Master',       desc:'Reach 10x combo',                   check:s=>(s.combo.maxCombo||0)>=10 },
  powerup_coll:  { icon:'🔋', title:'Power Collector',    desc:'Collect 10 power-ups',              check:s=>(s.powerupsCollected||0)>=10 },
};

const MOODS = [
  { id:'happy',   icon:'😊', label:'Happy',   minStreak:3, maxMissed:2, bonus:1.2 },
  { id:'neutral', icon:'😐', label:'Neutral',  minStreak:0, maxMissed:5, bonus:1.0 },
  { id:'stressed',icon:'😰', label:'Stressed', minStreak:-1, maxMissed:99, bonus:0.8 },
];

/* ═══════════════════════════ Feature Registry ═══════════════════════════ */
const PROMPT_HANDLERS = {};
const FEATURE_REGISTRY = {};
function registerFeature(key, def) {
  FEATURE_REGISTRY[key] = def;
  if (!PROMPT_HANDLERS[key]) {
    PROMPT_HANDLERS[key] = {
      words: def.words,
      msg: def.msg || 'Feature added!',
      bugs: def.bugs || 1,
      fn: def.fn || (() => { state.scene[key] = true; })
    };
  }
}
registerFeature('player',   { words:['player','character','hero','guy','girl'],       msg:'Spawning player character...',  bugs:1, fn:addPlayer,       desc:'Playable character in the scene' });
registerFeature('jump',     { words:['jump','jumping','bounce','hop','leap'],         msg:'Calculating jump physics...',   bugs:1, fn:addJump,        desc:'Jump ability for player',       deps:['player'] });
registerFeature('djump',    { words:['double jump','double-jump','2x jump'],          msg:'Double jump module installed!', bugs:2, fn:addDJump,       desc:'Double jump for player',         deps:['player','jump'] });
registerFeature('dash',     { words:['dash','sprint','dodge','roll'],                 msg:'Dash mechanic activated!',      bugs:2, fn:addDash,        desc:'Dash/roll for player',           deps:['player'] });
registerFeature('enemies',  { words:['enemy','enemies','monster','monsters','bad'],   msg:'Spawning hostile entities...',  bugs:3, fn:addEnemies,     desc:'Enemy characters spawn',         deps:['player'] });
registerFeature('platforms',{ words:['platform','platforms','block','blocks','tile'], msg:'Building platforms...',         bugs:2, fn:addPlatforms,   desc:'Platforms to jump on' });
registerFeature('powerups', { words:['powerup','power-ups','power up','boost'],       msg:'Power-up system online!',       bugs:2, fn:addPowerups,    desc:'Collectible power-ups',            deps:['player'] });
registerFeature('coins',    { words:['coin','coins','money','gold','treasure'],       msg:'Dropping coins into the world...',bugs:1, fn:addCoins,      desc:'Collectible coins' });
registerFeature('score',    { words:['score','points','scoring','counter'],           msg:'Score display calibrated!',     bugs:1, fn:addScore,       desc:'Score counter display' });
registerFeature('health',   { words:['health','hp','life','lives','hearts'],          msg:'Health system initialized...',  bugs:2, fn:addHealth,      desc:'Health bar for player',          deps:['player'] });
registerFeature('speed',    { words:['speed','fast','run','accelerate','move speed'], msg:'Tuning movement speed...',      bugs:2, fn:addSpeed,       desc:'Speed lines visual effect',      deps:['player'] });
registerFeature('weapon',   { words:['weapon','gun','sword','shoot','attack','gun'],  msg:'Equipping weapon...',           bugs:2, fn:addWeapon,      desc:'Shoot projectiles at bugs',       deps:['player'] });
registerFeature('boss',     { words:['boss','giant','big enemy','dragon','final'],    msg:'Spawning boss entity! This is big!', bugs:4, fn:addBoss,   desc:'Giant boss enemy' });
registerFeature('levels',   { words:['level','levels','stage','stages','world'],      msg:'Level system constructed!',     bugs:2, fn:addLevels,      desc:'Level/stage progression' });
registerFeature('music',    { words:['music','song','soundtrack','melody','tune'],    msg:'Audio engine humming...',       bugs:1, fn:addMusic,       desc:'Background music element' });
registerFeature('particles',{ words:['particle','particles','effects','vfx','fire'],  msg:'Particle system initialized!',  bugs:2, fn:addParticles,   desc:'Floating particle effects' });
registerFeature('clouds',   { words:['cloud','clouds','sky','weather','atmosphere'],  msg:'Generating cloud layer...',     bugs:1, fn:addClouds,      desc:'Drifting clouds in background' });
registerFeature('trees',    { words:['tree','trees','nature','forest','plant'],       msg:'Planting trees...',             bugs:1, fn:addTrees,       desc:'Trees in the scene' });
registerFeature('water',    { words:['water','river','lake','ocean','sea','lava'],    msg:'Flooding the scene...',         bugs:2, fn:addWater,       desc:'Water/lava below ground' });
registerFeature('background',{words:['background','bg','color','theme','sky color'],  msg:'Repainting the world...',       bugs:1, fn:addBackground,  desc:'Random background color' });
// UI unlock features
registerFeature('achievements',{words:['achievements','achievement','trophy','trophies'], msg:'Achievement system online!',    bugs:1, fn:()=>unlockUI('achievements'), desc:'Track your accomplishments' });
registerFeature('stats',      {words:['stats','statistics','stat','data','analytics'],     msg:'Statistics module loaded!',     bugs:1, fn:()=>unlockUI('stats'),       desc:'View detailed game stats' });
registerFeature('mute',       {words:['mute','silence','toggle sound'],                         msg:'Sound controls activated!',     bugs:0, fn:()=>unlockUI('mute'),        desc:'Toggle sound effects' });
registerFeature('reset',      {words:['reset','restart','clear','wipe','fresh'],           msg:'Reset functionality added!',    bugs:0, fn:()=>unlockUI('reset'),       desc:'Reset all progress' });
registerFeature('combo',      {words:['combo','multiplier','chain','streak','consecutive'],msg:'Combo system initialized!',     bugs:2, fn:()=>unlockUI('combo'),       desc:'Squash bugs in quick succession',  deps:['player'] });
registerFeature('mood',       {words:['mood','emotion','feeling','vibe','attitude'],        msg:'AI mood display enabled!',      bugs:1, fn:()=>unlockUI('mood'),        desc:'See the AI emotional state' });
registerFeature('list',       {words:['list','catalog','guide','help','manual','index'],    msg:'Feature list compiled!',         bugs:0, fn:()=>unlockUI('list'),        desc:'Browse all discoverable features' });
registerFeature('settings',   {words:['settings','options','preferences','config','setup'],  msg:'Settings panel unlocked!',       bugs:0, fn:()=>unlockUI('settings'),    desc:'Configure game options' });
// Core unlockable features
registerFeature('movement',  {words:['move','movement','walk','controls','navigation'],      msg:'Movement controls online!',      bugs:1, fn:addMovement,     desc:'WASD/Arrow movement for player',  deps:['player'] });
registerFeature('audio',     {words:['audio','advanced audio','mixer','sound settings','equalizer','volume control'],  msg:'Advanced audio panel online!',   bugs:0, fn:addAudio,       desc:'Independent volume controls' });
registerFeature('bullets',   {words:['bullets','ammo','ammunition','magazine','bullet'],      msg:'Ammo system online! Squash bugs to reload.', bugs:1, fn:addBullets, desc:'Limited ammo — squash bugs to refill', deps:['weapon'] });
// New features
registerFeature('gravity',   {words:['gravity','fall','down','pull','attract'],              msg:'Gravity field activated!',       bugs:2, fn:addGravity,      desc:'Bugs are pulled downward' });
registerFeature('shield',    {words:['shield','barrier','protect','guard','defense'],         msg:'Shield bubble deployed!',        bugs:2, fn:addShield,       desc:'Auto-squash bugs near engine',  deps:['player'] });
registerFeature('storm',     {words:['storm','rain','lightning','weather','thunder'],         msg:'Storm clouds gathering...',      bugs:2, fn:addStorm,        desc:'Lightning & rain effects' });

/* ─── DOM refs ─── */
const $ = id => document.getElementById(id);
const scene = $('scene'), chatLog = $('chat-log'), featList = $('feat-list');
const promptInput = $('prompt-input'), sendBtn = $('send-btn');
const scoreVal = $('score-val'), squashVal = $('squash-val'), missVal = $('miss-val');
const featVal = $('feat-val'), streakVal = $('streak-val');
const playerEl = $('player-el'), sceneScore = $('scene-score');
const sceneHealth = $('scene-health'), sceneHealthBar = $('scene-health-bar');
const sceneLevel = $('scene-level'), thinkingEl = $('thinking');
const glitchEl = $('glitch'), glitchOv = $('glitch-overlay');
const toastEl = $('toast'), achieveToast = $('achieve-toast');
const achieveOverlay = $('achieve-overlay'), achieveList = $('achieve-list');
const moodIcon = $('mood-icon');
const comboMeter = $('combo-meter'), comboCount = comboMeter.querySelector('.count');
const comboTimerFill = comboMeter.querySelector('.timer-fill');
const multVal = $('mult-val');
const ammoVal = $('ammo-val'), ammoDisplay = $('ammo-display');
const listOverlay = $('list-overlay'), listContent = $('list-content');
const settingsOverlay = $('settings-overlay'), settingsContent = $('settings-content');
const statsOverlay = $('stats-overlay'), statsContent = $('stats-content');
const audioOverlay = $('audio-overlay'), audioContent = $('audio-content');

/* ─── Initialization ─── */
function init() {
  createStars();
  if (state.features.size > 0) restoreFeatures();
  updateMood();
  updateUI();

  addChat('🤖 Welcome to Prompter! Try prompts to discover features...', 'ai');
  if (state.features.size > 0) addChat('💾 Save loaded! You have ' + state.features.size + ' features.', 'ai');
  else addChat('💡 Start with: "player", "jump", "enemies", "score", "music", "achievements", "combo"...', 'ai');

  promptInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !state.busy) submitPrompt(); });
  sendBtn.addEventListener('click', () => { if (!state.busy) submitPrompt(); });
  // Close any overlay helper
  function closeAllOverlays() {
    [achieveOverlay, statsOverlay, listOverlay, settingsOverlay, audioOverlay].forEach(o => o.classList.remove('show'));
  }
  function toggleOverlay(el) {
    const wasOpen = el.classList.contains('show');
    closeAllOverlays();
    if (!wasOpen) el.classList.add('show');
  }
  $('achieve-btn').addEventListener('click', () => { toggleOverlay(achieveOverlay); renderAchievements(); });
  $('achieve-close').addEventListener('click', () => { achieveOverlay.classList.remove('show'); });
  achieveOverlay.addEventListener('click', e => { if (e.target === achieveOverlay) achieveOverlay.classList.remove('show'); });
  $('stats-btn').addEventListener('click', () => { toggleOverlay(statsOverlay); renderStats(); });
  $('stats-close').addEventListener('click', () => { statsOverlay.classList.remove('show'); });
  statsOverlay.addEventListener('click', e => { if (e.target === statsOverlay) statsOverlay.classList.remove('show'); });
  $('list-btn').addEventListener('click', () => { toggleOverlay(listOverlay); renderList(); });
  $('list-close').addEventListener('click', () => { listOverlay.classList.remove('show'); });
  listOverlay.addEventListener('click', e => { if (e.target === listOverlay) listOverlay.classList.remove('show'); });
  $('settings-btn').addEventListener('click', () => { toggleOverlay(settingsOverlay); renderSettings(); });
  $('settings-close').addEventListener('click', () => { settingsOverlay.classList.remove('show'); });
  settingsOverlay.addEventListener('click', e => { if (e.target === settingsOverlay) settingsOverlay.classList.remove('show'); });
  $('audio-btn').addEventListener('click', () => { toggleOverlay(audioOverlay); renderAudio(); });
  $('audio-close').addEventListener('click', () => { audioOverlay.classList.remove('show'); });
  audioOverlay.addEventListener('click', e => { if (e.target === audioOverlay) audioOverlay.classList.remove('show'); });
  $('reset-btn').addEventListener('click', resetGame);
  const muteBtn = $('mute-btn');
  muteBtn.addEventListener('click', () => {
    state.muted = !state.muted;
    muteBtn.textContent = state.muted ? '🔇' : '🔊';
    muteBtn.classList.toggle('muted', state.muted);
    setMusicMute(state.muted);
    saveState();
  });
  if (state.muted) { muteBtn.textContent = '🔇'; muteBtn.classList.add('muted'); setMusicMute(true); }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeAllOverlays(); }
    if (e.key === 'm' && !e.ctrlKey && !e.metaKey && document.activeElement !== promptInput) {
      state.muted = !state.muted;
      muteBtn.textContent = state.muted ? '🔇' : '🔊';
      muteBtn.classList.toggle('muted', state.muted);
      setMusicMute(state.muted);
      saveState();
    }
    // Player movement + shooting (movement gated behind feature)
    if (document.activeElement !== promptInput) {
      const m = ['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '];
      const isMoveKey = m.includes(e.key);
      if (isMoveKey && !e.ctrlKey && !e.metaKey) { e.preventDefault(); if (state.scene.movement) state.keys[e.key] = true; }
      if (e.key === ' ' && state.scene.weapon) shoot();
    }
  });
  document.addEventListener('keyup', e => { state.keys[e.key] = false; });
  scene.addEventListener('mousemove', t => {
    const r = scene.getBoundingClientRect();
    state.mouseX = t.clientX - r.left; state.mouseY = t.clientY - r.top;
  });
  scene.addEventListener('click', e => {
    if (state.busy || !state.scene.weapon) return;
    if (e.target.classList.contains('bug') || e.target.closest('.bug')) return;
    shoot();
  });
  requestAnimationFrame(tick);
}

function restoreFeatures() {
  // Temporarily clear scene flags so handlers don't early-return (they re-set them)
  const saved = {};
  function withFlag(key, fn) { saved[key] = state.scene[key]; state.scene[key] = false; fn(); state.scene[key] = saved[key]; }
  if (state.scene.player) { state.scene.player = false; addPlayer(); state.scene.player = true; }
  if (state.scene.jump) withFlag('jump', addJump);
  if (state.scene.djump) withFlag('djump', addDJump);
  if (state.scene.dash) withFlag('dash', addDash);
  if (state.scene.enemies) withFlag('enemies', addEnemies);
  if (state.scene.platforms) withFlag('platforms', addPlatforms);
  if (state.scene.powerups) withFlag('powerups', addPowerups);
  if (state.scene.coins) withFlag('coins', addCoins);
  if (state.scene.score) withFlag('score', addScore);
  if (state.scene.health) withFlag('health', addHealth);
  if (state.scene.speed) withFlag('speed', addSpeed);
  if (state.scene.weapon) withFlag('weapon', addWeapon);
  if (state.scene.boss) withFlag('boss', addBoss);
  if (state.scene.levels) withFlag('levels', addLevels);
  if (state.scene.music) withFlag('music', addMusic);
  if (state.scene.particles) withFlag('particles', addParticles);
  if (state.scene.clouds) withFlag('clouds', addClouds);
  if (state.scene.trees) withFlag('trees', addTrees);
  if (state.scene.water) withFlag('water', addWater);
  if (state.scene.bgColor) withFlag('bgColor', addBackground);
  if (state.scene.gravity) withFlag('gravity', addGravity);
  if (state.scene.shield) withFlag('shield', addShield);
  if (state.scene.storm) withFlag('storm', addStorm);

  if (state.scene.audio) withFlag('audio', addAudio);

  // Restore UI unlocks (unlockUI sets ui_ flags, no guard issue)

/* ═══════════════════════════ Achievements ═══════════════════════════ */
function unlockAchievement(id) {
  if (state.achievements[id]) return;
  state.achievements[id] = Date.now();
  saveState();
  const a = ACHIEVEMENTS[id];
  if (a) {
    // Only show notification if player has discovered achievements
    if (state.scene.ui_achievements) {
      achieveToast.innerHTML = `<span class="icon">${a.icon}</span><div class="title">🏆 ${a.title}</div><div class="desc">${a.desc}</div>`;
      achieveToast.classList.remove('show');
      void achieveToast.offsetWidth;
      achieveToast.classList.add('show');
      setTimeout(() => achieveToast.classList.remove('show'), 1900);
      playAchieve();
      addChat('🏆 Achievement unlocked: ' + a.title + '!', 'ai');
    }
  }
  if (state.scene.ui_achievements) renderAchievements();
}

function checkAchievements() {
  for (const [id, a] of Object.entries(ACHIEVEMENTS)) {
    if (!state.achievements[id] && a.check(state)) {
      unlockAchievement(id);
    }
  }
}

function renderAchievements() {
  achieveList.innerHTML = Object.entries(ACHIEVEMENTS).map(([id, a]) => {
    const unlocked = state.achievements[id];
    const d = unlocked ? new Date(unlocked) : null;
    return `<div class="ach-item${unlocked?' unlocked':''}">
      <span class="icon">${unlocked ? a.icon : '🔒'}</span>
      <div class="info">
        <div class="title">${a.title}</div>
        <div class="desc">${a.desc}</div>
      </div>
      ${d ? `<span class="date">${d.toLocaleDateString()}</span>` : ''}
    </div>`;
  }).join('');
}

/* ═══════════════════════════ AI Mood ═══════════════════════════ */
function calcMood() {
  if (state.streak >= 3 && state.missed <= 2) return MOODS[0];
  if (state.missed >= 6) return MOODS[2];
  return MOODS[1];
}

function getMoodBonus() { return calcMood().bonus; }

function updateMood() {
  const mood = calcMood();
  moodIcon.textContent = mood.icon;
  moodIcon.title = 'AI Mood: ' + mood.label + ' (x' + mood.bonus.toFixed(1) + ' score)';
}

/* ═══════════════════════════ Save / Load ═══════════════════════════ */
function saveState() {
  try {
    const s = {
      score: state.score, squashed: state.squashed, missed: state.missed,
      streak: state.streak, bestStreak: state.bestStreak,
      features: [...state.features], allFeatures: state.allFeatures,
      scene: { ...state.scene },
      promptCount: state.promptCount,
      cleanWaves: state.cleanWaves, totalWaves: state.totalWaves,
      bugWaves: state.bugWaves, bugSpeed: state.bugSpeed,
      achievements: state.achievements,
      totalSquashed: state.totalSquashed,
      combo: { count:0, multiplier:1, timer:0, maxCombo: (state.combo.maxCombo||0) },
      bossKills: state.bossKills || 0,
      bossWaves: state.bossWaves || 0,
      powerupsCollected: state.powerupsCollected || 0,
      muted: state.muted,
      volumeMaster: state.volumeMaster, volumeMusic: state.volumeMusic, volumeSfx: state.volumeSfx,
      ammo: state.ammo, maxAmmo: state.maxAmmo
    };
    localStorage.setItem(LS_KEY, JSON.stringify(s));
  } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    state.score = s.score || 0;
    state.squashed = s.squashed || 0;
    state.missed = s.missed || 0;
    state.streak = s.streak || 0;
    state.bestStreak = s.bestStreak || 0;
    state.allFeatures = s.allFeatures || [];
    if (s.features) s.features.forEach(f => state.features.add(f));
    if (s.scene) Object.assign(state.scene, s.scene);
    state.promptCount = s.promptCount || 0;
    state.cleanWaves = s.cleanWaves || 0;
    state.totalWaves = s.totalWaves || 0;
    state.bugWaves = s.bugWaves || 0;
    state.bugSpeed = s.bugSpeed || 0.3;
    state.achievements = s.achievements || {};
    state.totalSquashed = s.totalSquashed || 0;
    state.combo = s.combo || { count:0, multiplier:1, timer:0, maxCombo:0 };
    state.bossKills = s.bossKills || 0;
    state.bossWaves = s.bossWaves || 0;
    state.powerupsCollected = s.powerupsCollected || 0;
    state.muted = s.muted || false;
    if (s.volumeMaster !== undefined) state.volumeMaster = s.volumeMaster;
    if (s.volumeMusic !== undefined) state.volumeMusic = s.volumeMusic;
    if (s.volumeSfx !== undefined) state.volumeSfx = s.volumeSfx;
    state.ammo = s.ammo || 0;
    state.maxAmmo = s.maxAmmo || 12;
    if (state.ammo > state.maxAmmo) state.ammo = state.maxAmmo;
  } catch(e) {}
}

function addMusic() {
  state.scene.music = true;
  for (let i = 0; i < 3; i++) {
    addFeatureEl('music_'+i, ['🎵','🎶','🎵'][i], '', {
      className:'music-el scene-el', top: 20 + i*25 + '%',
      left: 10 + i*30 + '%', animDelay: i * 0.5
    });
  }
  // Start ambient background drone (always start, volume handled separately)
  if (!window._bgMusicStarted) {
    try {
      window._bgMusicStarted = true;
      const ctx = getAudio();
      if (ctx.state === 'suspended') ctx.resume().catch(()=>{});
      // Use audible frequencies (110Hz + 165Hz + soft pad at 330Hz)
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(110, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(110.5, ctx.currentTime + 4);
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(600, ctx.currentTime);
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.08, ctx.currentTime + 2);
      gain._origGain = 0.08;
      osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      osc.start();
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(165, ctx.currentTime);
      osc2.frequency.linearRampToValueAtTime(164.5, ctx.currentTime + 5);
      gain2.gain.setValueAtTime(0, ctx.currentTime);
      gain2.gain.linearRampToValueAtTime(0.05, ctx.currentTime + 3);
      gain2._origGain = 0.05;
      osc2.connect(gain2); gain2.connect(ctx.destination);
      osc2.start();
      window._bgMusicNodes = { ctx, gainNodes: [gain, gain2], nodes: [osc, gain, filter, osc2, gain2] };
      // Apply current volume settings
      setMusicMute(state.muted);
      addChat('🎵 Ambient background drone activated...', 'ai');
    } catch(e) { console.warn('bg music:', e); }
  }
}

    $('stats-btn').style.display = '';

  } else if (key === 'mute') {
    $('mute-btn').style.display = '';
    if (!silent) addChat('🔊 Sound controls unlocked! Press M to mute.', 'ai');
  } else if (key === 'reset') {
    $('reset-btn').style.display = '';
    if (!silent) addChat('🗑️ Reset button unlocked! Be careful!', 'ai');
  } else if (key === 'combo') {
    $('combo-meter').style.display = '';
    state.scene.ui_streak = true;
    $('streak-item').style.display = '';
    if (!silent) addChat('💫 Combo system unlocked! Quick squashes build multiplier!', 'ai');
  } else if (key === 'streak') {
    state.scene.ui_streak = true;
    $('streak-item').style.display = '';
    if (!silent) addChat('🔥 Streak counter unlocked!', 'ai');
  } else if (key === 'mood') {
    $('mood-icon').style.display = '';
    if (!silent) addChat('😊 AI Mood display unlocked! Mood affects score.', 'ai');
  } else if (key === 'list') {
    $('list-btn').style.display = '';

  } else if (key === 'settings') {
    $('settings-btn').style.display = '';
