  } else if (key === 'audio') {
    $('audio-btn').style.display = '';
    if (!silent) addChat('🔊 Audio mixer unlocked! Adjust volumes independently.', 'ai');
  }
  updateUI();
  saveState();
}

function addFeatureEl(id, content, tooltip, opts) {
  if (document.getElementById('fe_' + id)) return;
  opts = opts || {};
  const el = document.createElement('div');
  el.id = 'fe_' + id;
  el.className = opts.className || 'scene-el';
  el.textContent = content;
  if (tooltip) el.title = tooltip;
  if (opts.bottom !== undefined) el.style.bottom = (typeof opts.bottom === 'number' ? opts.bottom + 'px' : opts.bottom);
  if (opts.top !== undefined) el.style.top = opts.top;
  if (opts.left !== undefined) el.style.left = opts.left;
  if (opts.right !== undefined) el.style.right = opts.right;
  if (opts.fontSize) el.style.fontSize = opts.fontSize;
  if (opts.animDelay) el.style.animationDelay = typeof opts.animDelay === 'number' ? opts.animDelay + 's' : opts.animDelay;
  scene.appendChild(el);
}

/* ═══════════════════════════ Prompt Processing ═══════════════════════════ */
function submitPrompt() {
  const text = promptInput.value.trim();
  if (!text || text.length < 2) return;
  promptInput.value = '';
  state.busy = true;
  promptInput.disabled = true;
  sendBtn.disabled = true;

  const lower = text.toLowerCase();
  addChat('> ' + text, 'prompt');

  // Find matching handler — prefer longest/specific match
  let matched = null, handler = null, bestLen = 0;
  for (const [key, h] of Object.entries(PROMPT_HANDLERS)) {
    for (const w of h.words) {
      if (lower.includes(w) && w.length > bestLen) { matched = key; handler = h; bestLen = w.length; }
    }
  }

  thinkingEl.classList.add('show');
  const thinkTime = 400 + Math.random() * 500;

  setTimeout(() => {
    thinkingEl.classList.remove('show');

    if (handler && !state.scene[matched] && !state.features.has(matched)) {
      // Check dependencies
      const def = FEATURE_REGISTRY[matched];
      if (def && def.deps) {
        const missing = def.deps.filter(d => !state.scene[d]);
        if (missing.length > 0) {
          addChat('🤖 Need ' + missing.join(' + ') + ' first!', 'ai');
          spawnBugs(1 + Math.floor(Math.random() * 2));
          state.promptCount++; updateUI();
          state.busy = false; promptInput.disabled = false; sendBtn.disabled = false; promptInput.focus();
          return;
        }
      }
      const response = handler.msg;
      addChat('🤖 ' + response, 'ai');
      handler.fn();
      state.features.add(matched);
      state.allFeatures.push(matched);

      // Spawn bugs
      spawnBugs(handler.bugs);
    } else {
      // Generic response for unknown or repeated features
      if (handler && state.scene[matched]) {
        addChat('🤖 Already added that one! Try something new.', 'ai');
      } else {
        addChat('🤖 Interesting! ' + RESPONSES[Math.floor(Math.random() * RESPONSES.length)], 'ai');
      }
      // Still spawn a couple bugs
      spawnBugs(1 + Math.floor(Math.random() * 2));
    }

    state.promptCount++;
    updateUI();
  }, thinkTime);
}

/* ═══════════════════════════ Bug System ═══════════════════════════ */
function spawnBugs(count) {
  const sceneRect = scene.getBoundingClientRect();
  const engineEl = document.getElementById('engine-core');
  const engineRect = engineEl.getBoundingClientRect();
  const targetX = engineRect.left - sceneRect.left + engineRect.width / 2;
  const targetY = engineRect.top - sceneRect.top + engineRect.height / 2;

  const speed = state.bugSpeed + state.bugWaves * 0.02;
  const wave = state.bugWaves;

  // Boss wave every 5 waves
  if (wave > 0 && wave % 5 === 0) {
    spawnBoss(targetX, targetY);
  }

  for (let i = 0; i < count; i++) {
    const bug = document.createElement('div');
    bug.className = 'bug';

    const types = ['normal'];
    if (wave >= 3) types.push('armored');
    if (wave >= 2) types.push('fast');
    if (wave >= 4) types.push('stealth');
    const type = types[Math.floor(Math.random() * types.length)];

    const BUG_MAP = { normal:'🐛', armored:'🪲', fast:'🦗', stealth:'🦟' };
    bug.textContent = BUG_MAP[type];
    if (type !== 'normal') bug.classList.add(type);

    let x, y;
    const edge = Math.floor(Math.random() * 4);
    const pad = 30;
    if (edge === 0) { x = pad + Math.random() * (sceneRect.width - pad * 2); y = -pad; }
    else if (edge === 1) { x = sceneRect.width + pad; y = Math.random() * sceneRect.height * 0.7; }
    else if (edge === 2) { x = pad + Math.random() * (sceneRect.width - pad * 2); y = sceneRect.height + pad; }
    else { x = -pad; y = Math.random() * sceneRect.height * 0.7; }

    bug.style.left = x + 'px';
    bug.style.top = y + 'px';
    bug.dataset.x = x;
    bug.dataset.y = y;
    bug.dataset.targetX = targetX;
    bug.dataset.targetY = targetY;

    let spd = speed + Math.random() * 0.1;
    if (type === 'fast') spd *= 1.8;
    bug.dataset.speed = spd;
    bug.dataset.alive = 'true';
    bug.dataset.wobble = (Math.random() * 1000).toString();
    bug.dataset.type = type;
    if (type === 'armored') bug.dataset.armor = '2';

    bug.addEventListener('click', e => { squashBug(bug, e); });

    scene.appendChild(bug);
    state.bugs.push(bug);
  }
  state.bugWaves++;
  state.totalWaves++;
  if (wave % 5 !== 0) addChat('🐛 ' + count + ' bug' + (count > 1 ? 's' : '') + ' appeared! ', 'warn');
}

function spawnBoss(tx, ty) {
  const bug = document.createElement('div');
  bug.className = 'bug boss';
  bug.textContent = '🐜';
  bug.dataset.boss = 'true';
  bug.dataset.bossHp = '5';

  const x = 30 + Math.random() * (scene.getBoundingClientRect().width - 60);
  bug.style.left = x + 'px';
  bug.style.top = '-40px';
  bug.dataset.x = x;
  bug.dataset.y = -40;
  bug.dataset.targetX = tx;
  bug.dataset.targetY = ty;
  bug.dataset.speed = 0.15 + state.bugWaves * 0.005;
  bug.dataset.alive = 'true';
  bug.dataset.wobble = (Math.random() * 1000).toString();
  bug.dataset.type = 'boss';

  const hpBar = document.createElement('div');
  hpBar.className = 'hp-bar';
  const hpFill = document.createElement('div');
  hpFill.className = 'hp-fill';
  hpFill.style.width = '100%';
  hpBar.appendChild(hpFill);
  bug.appendChild(hpBar);
  bug.dataset.hpFill = '5';

  bug.addEventListener('click', e => { squashBug(bug, e); });

  scene.appendChild(bug);
  state.bugs.push(bug);
  state.bossWaves++;
  addChat('👑 BOSS BUG APPEARED! 🐜 It\'s HUGE!', 'err');
  showToast('👑 BOSS BUG!');
}

function squashBug(bug, event) {
  if (bug.dataset.alive !== 'true') return;

  const isBoss = bug.dataset.boss === 'true';

  // Armored bugs need 2 clicks
  if (bug.dataset.type === 'armored') {
    let armor = parseInt(bug.dataset.armor || '2');
    armor--;
    bug.dataset.armor = armor;
    bug.classList.add('hit-armor');
    setTimeout(() => bug.classList.remove('hit-armor'), 150);
    const hit = document.createElement('div');
    hit.className = 'bug-hit';
    hit.textContent = '🛡️';
    hit.style.left = bug.style.left;
    hit.style.top = (parseFloat(bug.dataset.y) - 8) + 'px';
    scene.appendChild(hit);
    setTimeout(() => hit.remove(), 600);
    if (armor > 0) return;
  }

  // Boss bug: reduce HP
  if (isBoss) {
    let hp = parseInt(bug.dataset.bossHp || '5');
    hp--;
    bug.dataset.bossHp = hp;
    const fill = bug.querySelector('.hp-fill');
    if (fill) fill.style.width = (hp / 5 * 100) + '%';
    bug.classList.add('hit-armor');
    setTimeout(() => bug.classList.remove('hit-armor'), 100);

    const hit = document.createElement('div');
    hit.className = 'bug-hit';
    hit.textContent = '💥';
    hit.style.left = (parseFloat(bug.dataset.x) - 5) + 'px';
    hit.style.top = (parseFloat(bug.dataset.y) - 15) + 'px';
    scene.appendChild(hit);
    setTimeout(() => hit.remove(), 600);

    // Spawn a mini-bug on hit
    if (hp > 0) {
      spawnMiniBug(parseFloat(bug.dataset.x), parseFloat(bug.dataset.y));
    } else {
      state.bossKills = (state.bossKills || 0) + 1;
      state.totalSquashed = (state.totalSquashed || 0) + 1;
    }
    playSquash();
    if (hp > 0) return;
  }

  bug.dataset.alive = 'false';
  bug.classList.add('squashed');

  // Combo
  const now = Date.now();
  if (now - state.combo.timer < 3000) {
    state.combo.count++;
    state.combo.multiplier = Math.min(10, 1 + state.combo.count * 0.5);
  } else {
    state.combo.count = 0;
    state.combo.multiplier = 1;
  }
  state.combo.timer = now;
  if (state.combo.count > state.combo.maxCombo) state.combo.maxCombo = state.combo.count;

  // Ammo refill on squash
  if (state.scene.bullets) {
    state.ammo = Math.min(state.maxAmmo, state.ammo + 2);
  }

  const moodBonus = getMoodBonus();
  const dblBonus = (state.effects.double && Date.now() < state.effects.double) ? 2 : 1;
  const points = Math.round(10 * moodBonus * state.combo.multiplier * dblBonus);
  state.squashed++;
  state.totalSquashed = (state.totalSquashed || 0) + 1;
  state.score += points;

  // Squash particles
  spawnSquashParticles(parseFloat(bug.dataset.x), parseFloat(bug.dataset.y));

  // Floating score text
  showFloatScore(parseFloat(bug.dataset.x), parseFloat(bug.dataset.y), points, state.combo.multiplier);

  // Hit effect
  const hit = document.createElement('div');
  hit.className = 'bug-hit';
  hit.textContent = '💥';
  hit.style.left = bug.style.left;
  hit.style.top = (parseFloat(bug.dataset.y) - 10) + 'px';
  scene.appendChild(hit);
  setTimeout(() => hit.remove(), 600);

  updateMood();
  updateUI();
  playSquash();

  setTimeout(() => {
    bug.remove();
    state.bugs = state.bugs.filter(b => b !== bug);
  }, 250);
}

function spawnMiniBug(x, y) {
  const bug = document.createElement('div');
  bug.className = 'bug';
  bug.textContent = '🦟';
  bug.classList.add('stealth');
  const angle = Math.random() * Math.PI * 2;
  const dist = 30 + Math.random() * 20;
  bug.style.left = (x + Math.cos(angle) * dist) + 'px';
  bug.style.top = (y + Math.sin(angle) * dist) + 'px';
  bug.dataset.x = x + Math.cos(angle) * dist;
  bug.dataset.y = y + Math.sin(angle) * dist;
  bug.dataset.targetX = parseFloat(document.getElementById('engine-core').dataset.tx || '0');
  bug.dataset.targetY = parseFloat(document.getElementById('engine-core').dataset.ty || '0');
  bug.dataset.speed = 0.4 + Math.random() * 0.2;
  bug.dataset.alive = 'true';
  bug.dataset.wobble = (Math.random() * 1000).toString();
  bug.dataset.type = 'stealth';
  bug.addEventListener('click', e => { squashBug(bug, e); });
  scene.appendChild(bug);
  state.bugs.push(bug);
  addChat('🦟 A mini-bug spawned from the boss!', 'warn');
}

/* ═══════════════════════════ Power-ups ═══════════════════════════ */
const POWERUP_TYPES = [
  { type:'freeze', icon:'❄️', label:'Freeze', duration:3000, desc:'Freeze bugs for 3s' },
  { type:'bomb',   icon:'💣', label:'Bomb',   duration:0,     desc:'Kill all bugs!' },
  { type:'double', icon:'⚡', label:'2x Score',duration:10000, desc:'Double score 10s' },
];

function spawnPowerup() {
  if (state.powerupEl) return;
  if (state.bugs.length === 0) return;
  const sceneRect = scene.getBoundingClientRect();
  const pType = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
  const el = document.createElement('div');
  el.className = 'powerup';
  el.dataset.type = pType.type;
  el.innerHTML = `<div class="glow"></div>${pType.icon}`;
  el.title = pType.desc;
  el.style.left = (20 + Math.random() * (sceneRect.width - 60)) + 'px';
  el.style.top = (20 + Math.random() * (sceneRect.height * 0.6)) + 'px';
  el.addEventListener('click', e => { collectPowerup(pType, el); e.stopPropagation(); });
  scene.appendChild(el);
  state.powerupEl = el;
  state.powerupTimer = Date.now() + 8000;
}

function collectPowerup(pType, el) {
  if (!state.powerupEl) return;
  el.remove();
  state.powerupEl = null;
  state.powerupsCollected = (state.powerupsCollected || 0) + 1;
  if (pType.type === 'freeze') {
    state.effects.freeze = Date.now() + 3000;
    showToast('❄️ Freeze! Bugs slowed!');
    addChat('❄️ Freeze activated! Bugs are frozen!', 'ai');
    document.querySelectorAll('.bug').forEach(b => b.style.animationPlayState = 'paused');
  } else if (pType.type === 'bomb') {
    state.effects.bomb = Date.now();
    showToast('💣 Bomb! All bugs destroyed!');
    addChat('💣 Bug bomb deployed!', 'ai');
    const bugs = [...state.bugs];
    bugs.forEach(b => { if (b.dataset.alive === 'true') killBug(b); });
    screenShake();
  } else if (pType.type === 'double') {
    state.effects.double = Date.now() + 10000;
    showToast('⚡ 2x Score for 10s!');
    addChat('⚡ Double score activated!', 'ai');
  }
  updateActiveEffects();
  playPowerup();
  checkAchievements();
  saveState();
}

function killBug(bug) {
  if (bug.dataset.alive !== 'true') return;
  bug.dataset.alive = 'false';
  bug.classList.add('squashed');
  spawnSquashParticles(parseFloat(bug.dataset.x), parseFloat(bug.dataset.y));
  bug.remove();
  state.bugs = state.bugs.filter(b => b !== bug);
}

function updateActiveEffects() {
  const bar = document.getElementById('active-effects');
  const now = Date.now();
  const active = [];
  if (state.effects.freeze && now < state.effects.freeze) active.push({ icon:'❄️', label:'Freeze', until:state.effects.freeze });
  if (state.effects.bomb) {} // one-shot, no timer display
  if (state.effects.double && now < state.effects.double) active.push({ icon:'⚡', label:'2x', until:state.effects.double });
  bar.innerHTML = active.map(a => `<div class="active-eff show"><span>${a.icon} ${a.label}</span><span class="timer">${Math.ceil((a.until - now)/1000)}s</span></div>`).join('');
  if (active.length === 0) bar.innerHTML = '';
}

/* ═══════════════════════════ Squash Particles ═══════════════════════════ */
function spawnSquashParticles(x, y) {
  const colors = ['#00cc88','#44ffaa','#00ff88','#66ffcc','#ffd700','#ff6644'];
  for (let i = 0; i < 8; i++) {
    const p = document.createElement('div');
    p.className = 'squash-particle';
    const angle = (i / 8) * Math.PI * 2 + Math.random() * 0.3;
    const dist = 20 + Math.random() * 20;
    p.style.setProperty('--dx', Math.cos(angle) * dist * (Math.random() > 0.5 ? 1 : -1) + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist * (Math.random() > 0.5 ? 1 : -1) + 'px');
    p.style.background = colors[i % colors.length];
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    scene.appendChild(p);
    setTimeout(() => p.remove(), 500);
  }
}

/* ═══════════════════════════ Shooting ═══════════════════════════ */
function shoot() {
  if (state.busy) return;
  if (!state.scene.weapon) return;
  if (state.shootCooldown > Date.now()) return;
  if (state.bugs.length === 0) return;
  if (!state.scene.player) return;
  // Ammo check
  if (state.scene.bullets && state.ammo <= 0) {
    showToast('🔫 No ammo! Squash bugs to reload.');
    return;
  }
  state.shootCooldown = Date.now() + 250;
  if (state.scene.bullets) { state.ammo--; updateUI(); }
  const p = state.playerPos;
  const mx = state.mouseX, my = state.mouseY;
  const dx = mx - p.x, dy = my - p.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist < 5) return;
  const el = document.createElement('div');
  el.className = 'projectile';
  el.textContent = '💥';
  el.dataset.x = p.x; el.dataset.y = p.y;
  el.dataset.vx = (dx / dist) * 8;
  el.dataset.vy = (dy / dist) * 8;
  el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
  scene.appendChild(el);
  state.projectiles.push(el);
  for (let i = 0; i < 3; i++) {
    const t = document.createElement('div');
    t.className = 'proj-trail';
    t.style.left = (p.x - 2 + Math.random()*4) + 'px';
    t.style.top = (p.y - 2 + Math.random()*4) + 'px';
    scene.appendChild(t);
    setTimeout(() => t.remove(), 300);
  }
  if (!state.muted) {
    try {
      const ctx = getAudio();
      const vol = getSfxVol();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.connect(g); g.connect(ctx.destination);
      o.frequency.setValueAtTime(800, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(200, ctx.currentTime+0.06);
      g.gain.setValueAtTime(0.03 * vol, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.08);
      o.start(); o.stop(ctx.currentTime+0.08);
    } catch(e) {}
  }
}

function updateProjectiles() {
  const alive = [];
  for (const el of state.projectiles) {
    let x = parseFloat(el.dataset.x) + parseFloat(el.dataset.vx);
    let y = parseFloat(el.dataset.y) + parseFloat(el.dataset.vy);
    el.dataset.x = x; el.dataset.y = y;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    if (tickCount % 2 === 0) {
      const t = document.createElement('div');
      t.className = 'proj-trail';
      t.style.left = x + 'px'; t.style.top = y + 'px';
      scene.appendChild(t);
      setTimeout(() => t.remove(), 300);
    }
    const sr = scene.getBoundingClientRect();
    if (x < -20 || x > sr.width + 20 || y < -20 || y > sr.height + 20) {
      el.remove(); continue;
    }
    let hit = false;
    for (const bug of state.bugs) {
      if (bug.dataset.alive !== 'true') continue;
      const bx = parseFloat(bug.dataset.x), by = parseFloat(bug.dataset.y);
      if (Math.abs(x - bx) < 16 && Math.abs(y - by) < 16) {
        killBug(bug);
        spawnSquashParticles(bx, by);
        state.squashed++;
        state.totalSquashed = (state.totalSquashed || 0) + 1;
        state.score += 10;
        showFloatScore(bx, by, 10, 1);
        updateUI();
        hit = true;
        break;
      }
    }
    if (hit) { el.remove(); }
    else { alive.push(el); }
  }
  state.projectiles = alive;
}

function showFloatScore(x, y, points, mult) {
  const el = document.createElement('div');
  el.className = 'float-score';
  el.textContent = mult > 1 ? '+' + points + ' x' + mult.toFixed(1) : '+' + points;
  el.style.color = mult > 2 ? '#ffd700' : mult > 1 ? '#00ff88' : '#00cc88';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  scene.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

/* ═══════════════════════════ Screen Shake ═══════════════════════════ */
let shakeTimeout = null;
function screenShake() {
  const game = document.getElementById('game');
  game.classList.remove('shake');
  void game.offsetWidth;
  game.classList.add('shake');
  clearTimeout(shakeTimeout);
  shakeTimeout = setTimeout(() => game.classList.remove('shake'), 150);
}

/* ═══════════════════════════ Bug Trails ═══════════════════════════ */
let trailCounter = 0;
function spawnBugTrail(x, y, color) {
  trailCounter++;
  if (trailCounter % 3 !== 0) return;
  const t = document.createElement('div');
  t.className = 'bug-trail';
  t.style.left = x + 'px';
  t.style.top = y + 'px';
  t.style.background = color || 'rgba(0,204,136,0.3)';
  scene.appendChild(t);
  setTimeout(() => t.remove(), 600);
}

function bugReachedEngine(bug) {
  if (bug.dataset.alive !== 'true') return;
  bug.dataset.alive = 'false';
  bug.remove();
  state.bugs = state.bugs.filter(b => b !== bug);
  state.missed++;
  state.score = Math.max(0, state.score - 5);
  state.streak = 0;
  updateUI();

  // Glitch effects
  glitchOv.classList.add('active');
  setTimeout(() => glitchOv.classList.remove('active'), 300);
  glitchEl.classList.add('active');
  setTimeout(() => glitchEl.classList.remove('active'), 200);

  addChat('⚠️ ' + GLITCH_RESPONSES[Math.floor(Math.random() * GLITCH_RESPONSES.length)], 'err');
  showToast('💥 BUG! -5');
  playGlitch();
  screenShake();
}

/* ═══════════════════════════ Game Loop ═══════════════════════════ */
let tickCount = 0;
function tick() {
  const sceneRect = scene.getBoundingClientRect();
  const engineEl = document.getElementById('engine-core');
  const engineRect = engineEl.getBoundingClientRect();
  const targetX = engineRect.left - sceneRect.left + engineRect.width / 2;
  const targetY = engineRect.top - sceneRect.top + engineRect.height / 2;
  engineEl.dataset.tx = targetX;
  engineEl.dataset.ty = targetY;

  const now = Date.now();
  const frozen = state.effects.freeze && now < state.effects.freeze;

  for (const bug of state.bugs) {
    if (bug.dataset.alive !== 'true') continue;
    let bx = parseFloat(bug.dataset.x);
    let by = parseFloat(bug.dataset.y);
    const spd = parseFloat(bug.dataset.speed);
    const wobble = parseFloat(bug.dataset.wobble);
    const isBoss = bug.dataset.boss === 'true';
    const dx = targetX - bx;
    const dy = targetY - by;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < 5) {
      bugReachedEngine(bug);
      continue;
    }

    const effectiveSpeed = frozen ? spd * 0.1 : spd;
    const w = isBoss ? 0 : Math.sin(Date.now() / 300 + wobble) * 0.6;
    const gravityDrift = state.scene.gravity ? effectiveSpeed * 0.35 : 0;
    const nx = bx + (dx / dist) * effectiveSpeed + w;
    const ny = by + (dy / dist) * effectiveSpeed + gravityDrift;
    bug.dataset.x = nx;
    bug.dataset.y = ny;
    bug.style.left = nx + 'px';
    bug.style.top = ny + 'px';

    if (!isBoss) {
      bug.style.transform = `rotate(${Math.sin(Date.now() / 200 + wobble) * 10}deg)`;
    }

    // Bug trail
    const trailColor = isBoss ? 'rgba(255,50,50,0.3)' : bug.dataset.type === 'fast' ? 'rgba(100,200,255,0.3)' : 'rgba(0,204,136,0.2)';
    spawnBugTrail(nx, ny, trailColor);
  }

  // Shield: auto-zap bugs near engine
  if (state.scene.shield) {
    const shieldRadius = 50;
    for (const bug of state.bugs) {
      if (bug.dataset.alive !== 'true') continue;
      const bx = parseFloat(bug.dataset.x), by = parseFloat(bug.dataset.y);
      if (Math.abs(bx - targetX) < shieldRadius && Math.abs(by - targetY) < shieldRadius) {
        killBug(bug);
        state.squashed++;
        state.totalSquashed = (state.totalSquashed || 0) + 1;
        state.score += 5;
        spawnSquashParticles(bx, by);
        updateUI();
      }
    }
  }

  // Storm: random lightning strike on a bug
  if (state.scene.storm && state.bugs.length > 0 && tickCount % 180 === 0 && Math.random() < 0.3) {
    const liveBugs = state.bugs.filter(b => b.dataset.alive === 'true');
    if (liveBugs.length > 0) {
      const target = liveBugs[Math.floor(Math.random() * liveBugs.length)];
      killBug(target);
      state.squashed++;
      state.totalSquashed = (state.totalSquashed || 0) + 1;
      state.score += 5;
      spawnSquashParticles(parseFloat(target.dataset.x), parseFloat(target.dataset.y));
      // Flash effect
      glitchEl.classList.add('active');
      setTimeout(() => glitchEl.classList.remove('active'), 80);
      updateUI();
    }
  }

  // Player movement (WASD / Arrows) — gated behind 'movement' feature
  if (state.scene.player && state.scene.movement) {
    let dx = 0, dy = 0;
    const k = state.keys;
    if (k['w'] || k['ArrowUp']) dy = -state.playerSpeed;
    if (k['s'] || k['ArrowDown']) dy = state.playerSpeed;
    if (k['a'] || k['ArrowLeft']) dx = -state.playerSpeed;
    if (k['d'] || k['ArrowRight']) dx = state.playerSpeed;

    state.playerPos.x = Math.max(0, Math.min(sceneRect.width - 20, state.playerPos.x + dx));
    state.playerPos.y = Math.max(0, Math.min(sceneRect.height - 40, state.playerPos.y + dy));
    const px = state.playerPos.x, py = state.playerPos.y;
    playerEl.style.left = px + 'px';
    playerEl.style.top = py + 'px';
    // Flip player based on direction
    if (dx < 0) playerEl.style.transform = 'scaleX(-1)';
    else if (dx > 0) playerEl.style.transform = 'scaleX(1)';
    else if (state.mouseX < px) playerEl.style.transform = 'scaleX(-1)';
    else playerEl.style.transform = 'scaleX(1)';
  }

  // Rotate equipment (weapon etc.) toward mouse — works even without movement feature
  if (state.scene.player) {
    const slots = playerEl.querySelectorAll('.equip-slot');
    if (slots.length > 0) {
      const px = state.playerPos.x, py = state.playerPos.y;
      const angle = Math.atan2(state.mouseY - py, state.mouseX - px) * (180 / Math.PI);
      slots.forEach(s => { s.style.transform = 'rotate(' + angle + 'deg)'; });
    }
  }

  // Update projectiles
  if (state.projectiles.length > 0) updateProjectiles();

  // Power-up spawn timer (every ~8-15s) - only if powerups feature unlocked
  if (state.scene.powerups && !state.powerupEl && state.bugs.length > 0 && tickCount % 480 === 0) {
    if (Math.random() < 0.4) spawnPowerup();
  }
  // Expire uncollected power-ups
  if (state.powerupEl && Date.now() > state.powerupTimer) {
    state.powerupEl.remove();
    state.powerupEl = null;
  }
  // Handle freeze expiration
  if (state.effects.freeze && Date.now() > state.effects.freeze) {
    state.effects.freeze = 0;
    showToast('❄️ Freeze wore off!');
  }
  // Handle double score expiration
  if (state.effects.double && Date.now() > state.effects.double) {
    state.effects.double = 0;
    showToast('⚡ 2x Score expired!');
  }
  // Update active effects display (every 30 ticks)
  if (tickCount % 30 === 0) updateActiveEffects();

  // Combo timer decay
  if (state.combo.count > 0) {
    const elapsed = Date.now() - state.combo.timer;
    if (elapsed > 3000) {
      state.combo.count = 0;
      state.combo.multiplier = 1;
      comboMeter.classList.remove('show');
    } else {
      comboMeter.classList.add('show');
      comboCount.textContent = 'x' + state.combo.multiplier.toFixed(1);
      comboTimerFill.style.width = ((3000 - elapsed) / 3000 * 100) + '%';
    }
  } else {
    comboMeter.classList.remove('show');
  }

  // Check if all bugs are cleared to allow next prompt
  if (state.bugs.length === 0 && state.busy) {
    state.busy = false;
    promptInput.disabled = false;
    sendBtn.disabled = false;
    promptInput.focus();
    if (state.missed === 0 || state.missed === state.totalWaves - state.cleanWaves) {
      state.cleanWaves++;
    }
    state.streak++;
    if (state.streak > state.bestStreak) state.bestStreak = state.streak;
    if (state.streak > 1) {
      showToast('🔥 ' + state.streak + ' streak!');
    }
    checkAchievements();
    updateUI();
    saveState();
  }

  tickCount++;
  if (tickCount % 60 === 0) {
    updateMood();
  }

  requestAnimationFrame(tick);
}

/* ═══════════════════════════ UI & Audio ═══════════════════════════ */
function updateUI() {
  scoreVal.textContent = state.score;
  squashVal.textContent = state.squashed;
  missVal.textContent = state.missed;
  featVal.textContent = state.features.size;
  streakVal.textContent = state.streak;
  updateMood();

  // Update multiplier display (gate behind combo or mood discovery)
  const multDisp = document.getElementById('mult-display');
  if (state.scene.ui_combo || state.scene.ui_mood) {
    multDisp.style.display = '';
    const moodBonus = getMoodBonus();
    const comboBonus = state.combo.multiplier;
    const dblBonus = (state.effects.double && Date.now() < state.effects.double) ? 2 : 1;
    const totalMult = (moodBonus * comboBonus * dblBonus).toFixed(1);
    multVal.textContent = totalMult;
    if (parseFloat(totalMult) > 1.5) { multDisp.style.opacity = '1'; multDisp.style.borderColor = 'rgba(255,215,0,0.3)'; }
    else { multDisp.style.opacity = '0.4'; multDisp.style.borderColor = 'rgba(255,215,0,0.12)'; }
  } else {
    multDisp.style.display = 'none';
  }

  if (state.scene.score && state.squashed > 0) {
    sceneScore.textContent = 'SCORE: ' + state.score;
  }

  // Ammo display
  if (state.scene.bullets) {
    ammoDisplay.style.display = '';
    ammoVal.textContent = state.ammo + '/' + state.maxAmmo;
  } else {
    ammoDisplay.style.display = 'none';
  }

  if (state.features.size > 0) {
    featList.innerHTML = [...state.features].map(f => '<span class="feat">✦ ' + f + '</span>').join('');
  }
}

/* ═══════════════════════════ Stats & Reset ═══════════════════════════ */
function renderStats() {
  const totalBugs = state.totalSquashed + state.missed;
  const accuracy = totalBugs > 0 ? Math.round(state.totalSquashed / totalBugs * 100) : 0;
  const bossKills = state.bossKills || 0;
  const maxCombo = state.combo.maxCombo || 0;
  const pu = state.powerupsCollected || 0;
  statsContent.innerHTML = `
    <div class="stat-row"><span class="label">Score</span><span class="value">${state.score}</span></div>
    <div class="stat-row"><span class="label">Bugs Squashed</span><span class="value">${state.squashed}</span></div>
    <div class="stat-row"><span class="label">Bugs Missed</span><span class="value">${state.missed}</span></div>
    <div class="stat-row"><span class="label">Accuracy</span><span class="value">${accuracy}%</span></div>
    <div class="stat-row"><span class="label">Prompts Sent</span><span class="value">${state.promptCount}</span></div>
    <div class="stat-row"><span class="label">Features Added</span><span class="value">${state.features.size}</span></div>
    <div class="stat-row"><span class="label">Bug Waves</span><span class="value">${state.totalWaves}</span></div>
    <div class="stat-row"><span class="label">Clean Waves</span><span class="value">${state.cleanWaves}</span></div>
    <div class="stat-row"><span class="label">Boss Bugs Defeated</span><span class="value">${bossKills}</span></div>
    <div class="stat-row"><span class="label">Best Streak</span><span class="value">${state.bestStreak}</span></div>
    <div class="stat-row"><span class="label">Max Combo</span><span class="value">x${maxCombo.toFixed(1)}</span></div>
    <div class="stat-row"><span class="label">Power-ups Collected</span><span class="value">${pu}</span></div>
    <div class="stat-row"><span class="label">Achievements</span><span class="value">${Object.keys(state.achievements).length} / ${Object.keys(ACHIEVEMENTS).length}</span></div>
    ${state.scene.bullets ? `<div class="stat-row"><span class="label">Ammo</span><span class="value">${state.ammo} / ${state.maxAmmo}</span></div>` : ''}
  `;
}

function renderList() {
  let html = '';
  for (const [key, def] of Object.entries(FEATURE_REGISTRY)) {
    const u = state.features.has(key);
    html += `<div class="feat-row ${u ? 'unlocked' : 'locked'}">
      <span class="icon">${u ? '🔓' : '🔒'}</span>
      <span class="name">${key}</span>
      <span class="desc">${def.desc || ''}</span>
    </div>`;
  }
  listContent.innerHTML = html;
}

function renderSettings() {
  settingsContent.innerHTML = `
    <div class="set-row">
      <span>🔊 Sound</span>
      <span>${state.muted ? '🔇 Muted' : '🔊 On'}</span>
    </div>
    <div class="set-row">
      <span>📊 Score</span>
      <span>${state.score}</span>
    </div>
    <div class="set-row">
      <span>🏆 Features Unlocked</span>
      <span>${state.features.size}</span>
    </div>
    <div class="set-row">
      <span>🐛 Bugs Squashed</span>
      <span>${state.squashed}</span>
    </div>
    <div class="set-row">
      <span>🚀 Version</span>
      <span>1.0</span>
    </div>
  `;
}

function resetGame() {
  if (!confirm('Reset all progress? This cannot be undone!')) return;
  localStorage.removeItem(LS_KEY);
  location.reload();
}

function addChat(text, cls) {
  const msg = document.createElement('div');
  msg.className = 'chat-msg ' + cls;
  msg.innerHTML = text;
  chatLog.appendChild(msg);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.remove('show');
  void toastEl.offsetWidth;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1100);
}

let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  return audioCtx;
}
function getSfxVol() { return state.muted ? 0 : state.volumeMaster * state.volumeSfx; }
function playSquash() {
  const vol = getSfxVol(); if (!vol) return;
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(600, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.06 * vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    osc.start(); osc.stop(ctx.currentTime + 0.1);
  } catch(e) {}
}
function playGlitch() {
  const vol = getSfxVol(); if (!vol) return;
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(100, ctx.currentTime);
    osc.frequency.setValueAtTime(50, ctx.currentTime + 0.05);
    osc.frequency.setValueAtTime(150, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.05 * vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.start(); osc.stop(ctx.currentTime + 0.15);
  } catch(e) {}
}
function playAchieve() {
  const vol = getSfxVol(); if (!vol) return;
  try {
    const ctx = getAudio();
    const notes = [523, 659, 784];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.08);
      gain.gain.setValueAtTime(0.05 * vol, ctx.currentTime + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.15);
      osc.start(ctx.currentTime + i * 0.08); osc.stop(ctx.currentTime + i * 0.08 + 0.15);
    });
  } catch(e) {}
}
function playPowerup() {
  const vol = getSfxVol(); if (!vol) return;
  try {
    const ctx = getAudio();
    const notes = [880, 1108, 1318];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine';
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.05);
      gain.gain.setValueAtTime(0.04 * vol, ctx.currentTime + i * 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.05 + 0.12);
      osc.start(ctx.currentTime + i * 0.05); osc.stop(ctx.currentTime + i * 0.05 + 0.12);
    });
  } catch(e) {}
}

function renderAudio() {
  audioContent.innerHTML = `
    <div class="vol-row">
      <label><span>🔊 Master</span><span id="vol-master-label">${Math.round(state.volumeMaster * 100)}%</span></label>
      <input type="range" min="0" max="100" value="${state.volumeMaster * 100}" id="vol-master" data-key="volumeMaster">
    </div>
    <div class="vol-row">
      <label><span>🎵 Music</span><span id="vol-music-label">${Math.round(state.volumeMusic * 100)}%</span></label>
      <input type="range" min="0" max="100" value="${state.volumeMusic * 100}" id="vol-music" data-key="volumeMusic">
    </div>
    <div class="vol-row">
      <label><span>💥 SFX</span><span id="vol-sfx-label">${Math.round(state.volumeSfx * 100)}%</span></label>
      <input type="range" min="0" max="100" value="${state.volumeSfx * 100}" id="vol-sfx" data-key="volumeSfx">
    </div>
  `;
  ['vol-master','vol-music','vol-sfx'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', () => {
      state[el.dataset.key] = el.value / 100;
      document.getElementById(id + '-label').textContent = Math.round(el.value) + '%';
      updateMusicVolume();
      saveState();
    });
  });
}

function getMusicGain() {
  if (state.muted || !state.volumeMaster || !state.volumeMusic) return 0;
  return state.volumeMaster * state.volumeMusic;
}

function updateMusicVolume() {
  const bg = window._bgMusicNodes;
  if (!bg || !bg.gainNodes) return;
  const gain = getMusicGain();
  const now = bg.ctx.currentTime;
  bg.gainNodes.forEach(g => {
    g.gain.cancelScheduledValues(now);
    g.gain.setValueAtTime(gain ? g._origGain * gain : 0, now);
  });
}

function setMusicMute(muted) {
  const bg = window._bgMusicNodes;
  if (!bg || !bg.gainNodes) return;
  const gain = muted ? 0 : getMusicGain();
  const now = bg.ctx.currentTime;
  bg.gainNodes.forEach(g => {
    g.gain.cancelScheduledValues(now);
    g.gain.setValueAtTime(gain ? g._origGain * gain : 0, now);
    if (!muted && gain) g.gain.linearRampToValueAtTime(g._origGain * gain, now + 0.5);
  });
}

/* ─── Start ─── */
loadState();
init();
</script>
