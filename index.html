<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI ARCADE</title>
  <link rel="stylesheet" href="arcade.css">
</head>
<body>
  <div id="arcade">
    <div id="splash">
      <div class="splash-title">AI ARCADE</div>
      <div class="splash-subtitle">● WALK THE ARCADE ●</div>
      <div class="splash-prompt">▶ PRESS ANY KEY OR CLICK TO START ◀</div>
    </div>

    <div id="stage">
      <div id="camera">
        <div id="world"></div>
      </div>
    </div>

    <div id="hud">
      <span class="hud-group">
        <span>WASD / ↑↓ MOVE</span>
        <span>←→ / QE LOOK</span>
        <span>DRAG MOUSE TO LOOK</span>
      </span>
      <span id="hud-center">
        <span id="game-count">0 / 0</span>
        <span id="focused-title">— LOOK AROUND —</span>
      </span>
      <span class="hud-group">
        <span>ENTER / CLICK PLAY</span>
        <span>ESC CANCEL</span>
      </span>
    </div>

    <div class="scanlines"></div>
    <div class="vignette"></div>
  </div>

  <script src="games-data.js"></script>
  <script src="arcade.js"></script>
</body>
</html>
